# Overrides for a temporary PUBLIC deployment. Use both files together:
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --build
# What changes compared with the local stack:
#   - Neo4j publishes NO ports (7474 / 7687 are reachable only inside the compose network).
#   - The API publishes no port either: the browser reaches it only through the frontend's /api proxy.
#   - The frontend is the single published service, on PUBLIC_PORT (default 80, all interfaces).
#   - NEO4J_PASSWORD and TRUSTMESH_CORS_ORIGINS MUST be set (compose refuses to start otherwise).
# Put TLS in front of the frontend with the host's own proxy or the hosting platform; this file does not.
services:
  neo4j:
    ports: !reset []
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env to a new password, not trustmesh-demo}
      TM_HEALTH_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}

  loader:
    environment:
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}

  api:
    ports: !reset []
    environment:
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      TRUSTMESH_CORS_ORIGINS: ${TRUSTMESH_CORS_ORIGINS:?set TRUSTMESH_CORS_ORIGINS to the public frontend origin, e.g. https://demo.example.org}
      TRUSTMESH_TRUST_PROXY: "1"

  frontend:
    ports: !override
      - "${PUBLIC_PORT:-80}:80"
