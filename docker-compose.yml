# Local stack, one command:   docker compose up --build
#   Frontend       http://localhost:8080   (React; proxies /api to the API)
#   API docs       http://localhost:8000/docs
#   Neo4j browser  http://localhost:7474   (user neo4j, password from NEO4J_PASSWORD)
# Settings come from the environment or a .env file (see .env.example). The defaults below are for a
# stack bound to 127.0.0.1 only. For a temporary public deployment use docker-compose.deploy.yml on top.
# First start downloads Elliptic into ./data; the `loader` service fills Neo4j once and exits.
x-api-env: &api-env
  TRUSTMESH_DATA_DIR: /data
  TRUSTMESH_ARTIFACTS_DIR: /app/artifacts
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-trustmesh-demo}

services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-trustmesh-demo}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 1G
      TM_HEALTH_PASSWORD: ${NEO4J_PASSWORD:-trustmesh-demo}  # read only by the healthcheck below
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$TM_HEALTH_PASSWORD\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  loader:
    build: .
    command: ["python", "-m", "serving.load_neo4j"]
    environment: *api-env
    volumes:
      - ./data:/data
      - ./artifacts:/app/artifacts:ro
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      <<: *api-env
      HF_HOME: /hf-cache
      TRUSTMESH_CORS_ORIGINS: ${TRUSTMESH_CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      TRUSTMESH_MAX_UPLOAD_MB: ${TRUSTMESH_MAX_UPLOAD_MB:-10}
      TRUSTMESH_MAX_AUDIO_SECONDS: ${TRUSTMESH_MAX_AUDIO_SECONDS:-60}
      TRUSTMESH_RATE_LIMIT_PER_MINUTE: ${TRUSTMESH_RATE_LIMIT_PER_MINUTE:-30}
      TRUSTMESH_TRUST_PROXY: ${TRUSTMESH_TRUST_PROXY:-0}
      TRUSTMESH_RECORDING_MODE: ${TRUSTMESH_RECORDING_MODE:-0}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
      - ./artifacts:/app/artifacts:ro
      - hf-cache:/hf-cache
    depends_on:
      neo4j:
        condition: service_healthy
      loader:  # one model-loading process at a time: keeps peak memory inside Docker Desktop's default limit
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  neo4j-data:
  hf-cache:
