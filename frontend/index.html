<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TrustMesh: two fraud detectors, and the evidence for how far to trust each one." />
    <title>TrustMesh</title>
    <script>
      // Theme before first paint: the saved choice, else the operating system setting.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("tm-theme"); } catch (e) {}
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
