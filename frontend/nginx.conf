server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;   # a little above the API's own 10 MB audio limit, so the API's message is the one shown

    # The browser only ever talks to this origin; the API is not published separately in a deployment.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    # API docs and admin-style listings are not proxied to the public side.
    location ~ ^/api/(docs|redoc|openapi.json|cases) { return 404; }

    location / { try_files $uri /index.html; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
}
