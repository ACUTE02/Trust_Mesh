server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;   # a little above the API's own 10 MB audio limit, so the API's message is the one shown

    # The browser only ever talks to this origin; the API is not published separately in a deployment.
    location /api/ {
        resolver 127.0.0.11 valid=10s;   # Docker's DNS; looked up per request, so nginx starts without the API
        set $api http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    # API docs and admin-style listings are not proxied to the public side.
    location ~ ^/api/(docs|redoc|openapi.json|cases) { return 404; }

    # Text assets are compressed on the way out (fonts are already compressed).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Built files carry a hash in their name, so a name never changes its content: keep them for a year.
    # add_header inside a location replaces the server-level headers, so the security headers are repeated here.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        try_files $uri =404;
    }

    # The page itself is checked on every visit, so a new build is picked up at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
    }

    location / { try_files $uri /index.html; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
}
